server {
    listen 80;
    listen [::]:80;
    server_name 0trace.org www.0trace.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 0trace.org www.0trace.org;

    ssl_certificate /etc/letsencrypt/live/0trace.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0trace.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Apply rate limiting to all locations
    # NOTE: limit_req_zone and limit_conn_zone must be defined in main nginx.conf http block
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    location / {
        proxy_pass http://127.0.0.1:2029;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
